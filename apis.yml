name: Tass Vision
description: 'Tass Vision is a venture-backed technology startup that operates a product
  website at tassvision.ai. It markets two named products, SITRAC and VITRAC, each with
  its own product page and pricing page, alongside About, How It Works, Blog, Calendar,
  and Contact sections. The public site is a Vue single-page web application with Zendesk-based
  customer support. The company is backed by 500 Global and Big Sky Capital among a
  cluster of Central Asian venture funds and accelerators (IT Park Uzbekistan, Astana
  Hub, National UzVC, and others). As of this profiling the company exposes no public
  API, developer portal, SDKs, or machine-readable API specifications; this profile
  was surfaced as a 500 Global portfolio company and enriched with a live domain-security
  probe.'
